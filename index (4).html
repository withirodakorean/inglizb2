<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingliz tili B2 · Uy vazifasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly homework workbook for Uzbek learners, calm and encouraging
   IDEA: a coursebook's unit pages turned into tick-off exercise cards
   PICTURE: the unit list itself, each card with its own colour and progress bar
   COLOUR and TYPE: book-blue header, white cards, one colour per unit; Nunito
   LAYOUT: single 760px column, tabs, cards; stacks naturally on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0f1320);--card:light-dark(#fff,#181e2e);--ink:light-dark(#1d2433,#e7ebf5);
--mute:light-dark(#667085,#9aa3b8);--line:light-dark(#e3e7f0,#2a3248);--blue:#2f6fdc;--blue2:light-dark(#e8effc,#1d2a48);
--ok:#16a34a;--okbg:light-dark(#e8f7ee,#123222);--bad:#dc2626;--badbg:light-dark(#fdecec,#3a1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
header{background:var(--blue);color:#fff;padding:26px max(5vw,16px) 28px}
.wrap{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:clamp(24px,4.4vw,32px);line-height:1.15;font-weight:800;text-wrap:balance}
header h1 small{font-weight:600;font-size:.62em;opacity:.9}
header p{margin:6px 0 0;opacity:.92}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:700 14px Nunito,sans-serif;cursor:pointer;min-height:36px}
.pill:hover{background:rgba(255,255,255,.3)}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
label.h{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;font:16px Nunito,sans-serif;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.meta{color:var(--mute);font-size:14px}
.unit{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;border-left:7px solid var(--c);position:relative}
.unit:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,30,60,.12)}
.unit .k{color:var(--c);font-weight:800;font-size:13px}
.unit h2{margin:4px 0 6px;font-size:21px;line-height:1.25}
.unit h2 span,h1 .uz{font-weight:600;color:var(--mute);font-size:.8em}
h1 .uz{color:#fff;opacity:.85}
.unit .tp{color:var(--mute);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:560px){.tabs{grid-template-columns:1fr 1fr}}
.txt p{margin:0 0 12px;font-size:17px;line-height:1.7}
.gl{border:0;background:none;color:inherit;font:inherit;padding:0;border-bottom:2px dotted var(--blue);cursor:pointer}
.gl small{display:none;font-size:13px;color:var(--blue);font-weight:700;margin-left:4px}
.gl.on small{display:inline}
details summary{cursor:pointer;color:var(--blue);font-weight:800;margin-top:12px}
details p{color:var(--mute);font-size:15px}
.tf{display:flex;gap:8px}.tf .opt{flex:0 0 auto;min-width:100px;text-align:center}
h2.wt{font-size:22px;margin:4px 0 14px;line-height:1.25}h2.wt span{display:block;font-size:15px;color:var(--mute);font-weight:600}
.errs{display:flex;flex-wrap:wrap;gap:6px 4px;margin-bottom:12px}
.et{border:2px solid transparent;background:none;color:var(--ink);border-radius:8px;padding:4px 6px;font:17px Nunito,sans-serif;cursor:pointer;text-align:left}
.et:hover{border-color:var(--line)}
.et.sel{border-color:var(--blue);background:var(--blue2)}
.et .fx{display:block;font-size:13px;color:var(--ok);font-weight:800}
.model{background:light-dark(#f7f6f1,#1d2232);border-left:4px solid var(--blue);border-radius:10px;padding:12px 16px}
.model b{color:var(--blue)}.model p{margin:4px 0}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ph span{background:var(--blue2);border-radius:8px;padding:4px 10px;font-size:14px}
textarea{width:100%;min-height:220px;font:16px/1.6 Nunito,sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
.chk{list-style:none;padding:0;margin:10px 0}.chk li{padding:3px 0;color:var(--mute)}.chk li.y{color:var(--ok);font-weight:700}

.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:44px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
h3{margin:0 0 2px;font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h3 .st{font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap}
h3 .st.done{color:var(--ok)}
.ins{font-style:italic;color:var(--mute);font-size:14px;margin-bottom:12px}
.rule{background:var(--blue2);border-radius:10px;padding:12px 14px;margin-bottom:6px;font-size:15px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font:inherit;min-height:64px}
.w b{display:block;font-size:16px;line-height:1.25}.w span{font-size:13px;color:var(--mute);line-height:1.3;display:block;margin-top:2px}
.w:hover{border-color:var(--blue)}
.q{border-top:1px solid var(--line);padding:12px 0 4px}
.q .p{margin-bottom:8px}.q .p b{color:var(--blue);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1 1 180px}
.btn{border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:46px}
.btn.o{background:var(--card);color:var(--blue)}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;text-align:left;font:16px Nunito,sans-serif;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--blue)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{font-size:14px;margin-top:6px;min-height:0}.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.stage{font-weight:800;font-size:13px;color:var(--mute);margin:14px 0 6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt div{display:grid;gap:8px;align-content:start}
.mb{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font:15px Nunito,sans-serif;cursor:pointer;min-height:44px;text-align:center}
.mb.sel{border-color:var(--blue);background:var(--blue2)}
.mb.ok{opacity:.55;cursor:default}
.zone{min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tok{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;font:16px Nunito,sans-serif;cursor:pointer;min-height:40px}
.zone .tok{border-color:var(--blue);background:var(--blue2)}
.tok.used{visibility:hidden}
.next{display:block;width:100%;margin-top:6px}
footer{text-align:center;color:var(--mute);font-size:14px;padding:0 16px 30px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:14px Nunito,sans-serif;margin-top:6px}
@media(max-width:480px){.row input{flex-basis:100%}.q .row .btn{flex:1}.mt{gap:6px}.mb{font-size:14px;padding:8px 6px}.bank{grid-template-columns:1fr 1fr}}
</style>
</head>

1:{R:{t:"Small talk in a big city — by Dilnoza",
p:["When I moved from Tashkent to London to study, I thought my English was good enough. I was wrong. My grammar was fine, but I didn’t know the unwritten [rules|qoidalar] of conversation. On my first day, a classmate asked me how I was, and I gave her a detailed answer about my [homesickness|vatanni sog‘inish]. She looked a bit [awkward|noqulay] and quickly changed the subject.",
"I soon discovered that British people love [small talk|yengil suhbat]. They talk about the weather, the traffic or last night’s football match, but they rarely ask personal questions such as how much you [earn|ishlab topmoq]. In Uzbekistan, asking about someone’s family is a sign of respect; in London it can sometimes feel too [direct|to‘g‘ridan-to‘g‘ri].",
"I have been living here for two years now, and I have learnt a lot. I listen more than I speak, I ask open questions and I try to find [shared interests|umumiy qiziqishlar]. Last month I hit it off with my new neighbour simply because we both complained about the rain. Small talk, I realised, isn’t empty – it’s a bridge."],
uz:["Toshkentdan Londonga o‘qishga ko‘chib kelganimda, ingliz tilim yetarli deb o‘ylagandim. Adashgan ekanman. Grammatikam yaxshi edi, lekin suhbatning yozilmagan qoidalarini bilmasdim. Birinchi kuni sinfdoshim ahvolimni so‘radi, men esa vatanni sog‘inishim haqida batafsil gapirib berdim. U biroz noqulay bo‘ldi va tezda mavzuni o‘zgartirdi.","Tez orada britaniyaliklar yengil suhbatni yaxshi ko‘rishini bildim. Ular ob-havo, tirbandlik yoki kechagi futbol haqida gaplashishadi, lekin kam hollarda shaxsiy savollar, masalan, qancha pul ishlashingizni so‘rashadi. O‘zbekistonda birovning oilasi haqida so‘rash hurmat belgisi; Londonda esa bu ba’zan haddan tashqari to‘g‘ridan-to‘g‘ri tuyulishi mumkin.","Men bu yerda ikki yildan beri yashayapman va ko‘p narsa o‘rgandim. Gapirishdan ko‘ra ko‘proq tinglayman, ochiq savollar beraman va umumiy qiziqishlar topishga harakat qilaman. O‘tgan oy yangi qo‘shnim bilan darhol til topishdim — ikkalamiz ham yomg‘irdan noliganimiz uchun. Yengil suhbat bo‘sh gap emas ekan — u ko‘prikdir."],
tf:[["Dilnoza’s grammar was the main problem when she arrived.",false],["Her classmate felt uncomfortable after Dilnoza’s long answer.",true],["British people often ask how much you earn.",false],["Dilnoza has lived in London for two years.",true]],
q:[["What do British people usually talk about in small talk?","the weather and football","their salaries","their family problems"],["Why did Dilnoza get on well with her neighbour?","They both complained about the rain.","They were from the same city.","They studied together."],["What is the main idea of the text?","Small talk helps people connect.","British people are unfriendly.","Grammar is the most important skill."]],

2:{R:{t:"Two wheels on the Silk Road",
p:["In 2019, a 28-year-old teacher from Fergana called Sevara decided to [step out of her comfort zone|odatiy hayotidan chiqmoq]. She had never travelled further than Tashkent, but she had been dreaming about the Silk Road since childhood. So she bought a second-hand bike and set off for Istanbul.",
"The journey was far from easy. In Turkmenistan the heat was so intense that she could only cycle early in the morning. In Iran her bike was [damaged|shikastlangan] in a storm, and she was [stranded|qolib ketgan] in a small village for four days. ‘I was miserable at first,’ she says, ‘but the local people were incredibly kind. By the time the bike had been repaired, I had learnt to cook three Persian dishes.’",
"After almost four months and 5,000 kilometres, Sevara finally arrived in Istanbul. She was exhausted, but [relieved|yengil tortgan] and incredibly proud. Today she gives talks to students about [courage|jasorat] and [determination|qat’iyat]. ‘You don’t need to be fearless,’ she tells them. ‘You just need to start.’"],
uz:["2019-yilda Farg‘onalik 28 yoshli o‘qituvchi Sevara odatiy hayotidan chiqishga qaror qildi. U ilgari Toshkentdan uzoqqa sayohat qilmagan edi, ammo bolaligidan Buyuk Ipak yo‘lini orzu qilib kelardi. Shunday qilib, u ishlatilgan velosiped sotib oldi va Istanbulga yo‘l oldi.","Sayohat aslo oson bo‘lmadi. Turkmanistonda jazirama shunchalik kuchli ediki, u faqat erta tongda velosiped hayday olardi. Eronda bo‘ronda velosipedi shikastlandi va u kichik qishloqda to‘rt kun qolib ketdi. «Avvaliga juda baxtsiz edim, — deydi u, — lekin mahalliy odamlar nihoyatda mehribon edi. Velosiped tuzatilguncha men uchta fors taomini pishirishni o‘rganib olgan edim.»","Deyarli to‘rt oy va 5000 kilometrdan so‘ng Sevara nihoyat Istanbulga yetib keldi. U juda charchagan, ammo yengil tortgan va behad faxrlanardi. Bugun u talabalarga jasorat va qat’iyat haqida ma’ruzalar qiladi. «Qo‘rqmas bo‘lishingiz shart emas, — deydi u ularga. — Shunchaki boshlashingiz kerak.»"],
tf:[["Sevara had travelled abroad many times before 2019.",false],["She bought a new bike for the journey.",false],["Her bike was damaged in Iran.",true],["The journey took about four months.",true]],
q:[["Why did Sevara cycle early in the morning in Turkmenistan?","Because it was very hot.","Because the roads were busy.","Because she wanted to see the sunrise."],["What did she learn while she was waiting in the village?","to cook Persian dishes","to repair bikes","to speak Turkish"],["What is Sevara’s message to students?","You just need to start.","You must never be afraid.","Travelling alone is dangerous."]],
fw:[["shikastlangan","damaged"],["yengil tortgan","relieved"],["jasorat","courage"],["qat’iyat","determination"]]},

3:{R:{t:"Time or money?",
p:["If someone offered you a 20% pay rise in exchange for working an extra day every week, would you accept? A recent survey of young professionals in Tashkent found that almost 60% would say no. For a growing number of people, time has become more [valuable|qimmatli] than money.",
"Experts believe this is a sensible choice. ‘Money can always be earned again, but time can’t,’ says career coach Bobur Rahimov. He advises his clients to [set aside|ajratib qo‘ymoq] time every week for the things that really matter to them – family, health and learning. ‘Most people [fritter away|behuda sovurmoq] hours scrolling on their phones and then complain that they’re short of time.’",
"Rahimov believes that by 2035 many companies will have introduced a four-day week, and employees will be judged on results rather than hours. ‘The people who will succeed are the ones who [invest|sarmoya kiritmoq] in themselves now,’ he says. ‘Learn a language, pick up a new skill, make the most of every [opportunity|imkoniyat].’"],
uz:["Agar kimdir sizga har hafta bir kun ortiqcha ishlash evaziga maoshingizni 20% oshirishni taklif qilsa, rozi bo‘larmidingiz? Toshkentdagi yosh mutaxassislar o‘rtasidagi yaqindagi so‘rov ularning qariyb 60% «yo‘q» deyishini ko‘rsatdi. Tobora ko‘proq odamlar uchun vaqt puldan qimmatliroq bo‘lib qoldi.","Mutaxassislar buni oqilona tanlov deb hisoblaydi. «Pulni har doim yana ishlab topish mumkin, vaqtni esa yo‘q», — deydi martaba murabbiyi Bobur Rahimov. U mijozlariga har hafta o‘zlari uchun haqiqatan muhim narsalar — oila, salomatlik va o‘qishga vaqt ajratishni maslahat beradi. «Ko‘pchilik soatlab telefon varaqlab vaqtni behuda sovuradi, keyin vaqtim yetmaydi deb noliydi.»","Rahimovning fikricha, 2035-yilga kelib ko‘plab kompaniyalar to‘rt kunlik ish haftasini joriy qilgan bo‘ladi va xodimlar soatlar emas, natijalar bo‘yicha baholanadi. «Muvaffaqiyatga erishadiganlar — hozir o‘zlariga sarmoya kiritayotganlar, — deydi u. — Til o‘rganing, yangi ko‘nikma egallang, har bir imkoniyatdan to‘liq foydalaning.»"],
tf:[["Most people in the survey would work an extra day for more money.",false],["Bobur Rahimov is a career coach.",true],["He thinks people waste a lot of time on their phones.",true],["He believes companies will judge workers on hours, not results.",false]],
q:[["Why does Rahimov think time is more important than money?","Time can’t be earned again.","Money is not useful.","People have too much money."],["What does he think many companies will have done by 2035?","introduced a four-day week","stopped paying salaries","closed their offices"],["What does he advise people to do now?","invest in themselves","save all their money","work longer hours"]],
fw:[["qimmatli","valuable"],["ajratib qo‘ymoq","set aside"],["imkoniyat","opportunity"],["sarmoya kiritmoq","invest"]]},

m:{h:"Will technology give us more free time?",l:["These days, computers and the internet are becoming more and more important in our lives.","On the one hand, technology is likely to do many tasks for us. For example, self-driving cars will save time, and smart homes will do some of the housework.","On the other hand, people may have less free time because employers will expect them to be available all the time. Moreover, smartphones make it difficult to switch off.","In conclusion, I believe technology could give us more time, but only if we learn to control how we use it."]},
ph:["These days, … / In recent years, …","On the one hand, … On the other hand, …","For example / For instance, …","Additionally, … / Moreover, …","In my opinion, … / I believe that …","In conclusion, … / To sum up, …"],
task:"“Kelajakda odamlar uydan ishlaydi” mavzusida 160–220 so‘zlik esse yozing: ikkala tomonning dalillari va o‘z fikringiz.",min:160,max:220,
chk:[["On the one hand / On the other hand","on the other hand"],["Misol (For example / For instance)","for (example|instance)"],["Kelajak shakli (will / going to / will be -ing)","\\b(will|going to|'ll)\\b"],["Xulosa (In conclusion / To sum up)","(in conclusion|to sum up|overall)"]]}},

4:{R:{t:"Can an office make you creative?",
p:["Slides instead of stairs, hammocks instead of chairs and a ping-pong table in the meeting room: some of the world’s best-known companies have [redesigned|qayta loyihalashtirmoq] their offices to look more like playgrounds. The idea is simple – if employees are relaxed and having fun, they will come up with more [innovative|innovatsion] ideas.",
"But does it really work? Research suggests the answer is more complicated. A study carried out in 2022 found that colourful, [open-plan|ochiq rejali] offices helped people to share ideas, but they also made it harder to concentrate. Noise was the biggest problem: many employees said they had their best ideas at home, not at work.",
"Some designers now believe the perfect office should offer [variety|xilma-xillik]. In a new building in Tashkent City, for example, staff can choose between lively shared spaces, quiet ‘focus rooms’ and a small garden on the roof. ‘People aren’t the same, so their workspaces shouldn’t be the same either,’ says the architect. It may not look as [striking|ko‘zga tashlanadigan] as a slide, but it seems to be more practical."],
uz:["Zinapoya o‘rniga sirpanchiq, stul o‘rniga osma to‘r va majlislar xonasida stol tennisi: dunyoning eng mashhur kompaniyalaridan ba’zilari ofislarini o‘yin maydonchasiga o‘xshatib qayta loyihalashtirgan. G‘oya oddiy: agar xodimlar xotirjam bo‘lib, maroqli vaqt o‘tkazsa, ular ko‘proq innovatsion g‘oyalar o‘ylab topadi.","Lekin bu haqiqatan ham ishlaydimi? Tadqiqotlar javob murakkabroq ekanini ko‘rsatadi. 2022-yilda o‘tkazilgan tadqiqot rang-barang, ochiq rejali ofislar odamlarga g‘oya almashishga yordam berishini, biroq diqqatni jamlashni qiyinlashtirishini aniqladi. Eng katta muammo shovqin edi: ko‘plab xodimlar eng yaxshi g‘oyalari ishda emas, uyda kelishini aytdi.","Ba’zi dizaynerlar endi ideal ofis xilma-xillik taklif qilishi kerak deb hisoblaydi. Masalan, Tashkent City’dagi yangi binoda xodimlar jonli umumiy joylar, tinch «diqqat xonalari» va tomdagi kichik bog‘ orasidan tanlashlari mumkin. «Odamlar bir xil emas, shuning uchun ularning ish joylari ham bir xil bo‘lmasligi kerak», — deydi me’mor. Bu sirpanchiqdek ko‘zga tashlanmasligi mumkin, lekin amaliyroq ko‘rinadi."],
tf:[["Some companies have put slides and hammocks in their offices.",true],["The 2022 study showed open-plan offices made concentrating easier.",false],["Noise was the biggest problem for employees.",true],["The Tashkent City building has only one type of workspace.",false]],
q:[["Why do companies make their offices fun?","to help employees have more innovative ideas","to save money","to attract tourists"],["Where did many employees say they had their best ideas?","at home","in the meeting room","on the slide"],["What does the architect believe?","Different people need different workspaces.","All offices should have a slide.","Gardens are a waste of space."]],
fw:[["innovatsion","innovative"],["ochiq rejali","open-plan"],["xilma-xillik","variety"],["ko‘zga tashlanadigan","striking"]]},

task:"O‘qish bo‘limidagi matnni (yoki boshqa unitdagi matnni) 60–90 so‘z bilan o‘z so‘zlaringiz bilan qisqacha bayon qiling.",min:60,max:90,
chk:[["The article / The writer bilan boshlangan","(the article|the text|the writer)"],["According to …","according to"],["Qarama-qarshilik (However / but)","\\b(however|but|although)\\b"],["Xulosa (concludes / overall)","(conclude|overall|in short)"]]}},

5:{R:{t:"In defence of boredom",
p:["When was the last time you were truly bored? For most of us, the answer is ‘I can’t remember’. The moment we have nothing to do – waiting for a bus, standing in a queue – we reach for our phones. Psychologists warn that this habit may be making us less [creative|ijodkor].",
"In one famous experiment, two groups of people were asked to [come up with|o‘ylab topmoq] as many uses for a plastic cup as possible. Before the task, the first group had spent fifteen minutes copying numbers from a telephone book – an extremely [dull|zerikarli] activity. The second group went straight to the task. Surprisingly, the bored group produced far more original ideas.",
"Researchers think that when we are bored, our minds start to [wander|chalg‘imoq], and this helps us make unusual connections. So next time you find yourself with nothing to do, try not to [avoid|qochmoq] the feeling. Leave your phone in your pocket, look out of the window and let your thoughts settle. You might be surprised by what you [work out|anglab yetmoq]."],
uz:["Oxirgi marta qachon chinakamiga zerikkansiz? Ko‘pchiligimiz uchun javob — «eslay olmayman». Qiladigan ishimiz qolmagan zahoti — avtobus kutayotganda, navbatda turganda — telefonimizga qo‘l cho‘zamiz. Psixologlar bu odat bizni kamroq ijodkor qilayotgan bo‘lishi mumkinligidan ogohlantiradi.","Mashhur tajribalardan birida ikki guruh odamlardan plastik stakandan foydalanishning iloji boricha ko‘p usullarini o‘ylab topish so‘raldi. Topshiriqdan oldin birinchi guruh o‘n besh daqiqa telefon kitobidan raqamlar ko‘chirgan edi — bu o‘ta zerikarli mashg‘ulot. Ikkinchi guruh to‘g‘ridan-to‘g‘ri topshiriqqa o‘tdi. Ajablanarlisi, zerikkan guruh ancha ko‘p original g‘oyalar berdi.","Tadqiqotchilarning fikricha, zerikkanimizda xayolimiz chalg‘iy boshlaydi va bu bizga g‘ayrioddiy bog‘liqliklarni topishga yordam beradi. Shuning uchun keyingi safar qiladigan ishingiz bo‘lmasa, bu tuyg‘udan qochmang. Telefoningizni cho‘ntakda qoldiring, derazadan qarang va fikrlaringizni tinchlantiring. Nimani anglab yetganingizdan hayron qolishingiz mumkin."],
tf:[["Most people often feel bored nowadays.",false],["Psychologists think phones may make us less creative.",true],["The first group copied numbers before the task.",true],["The group that wasn’t bored had more original ideas.",false]],
q:[["What did the people have to think of?","uses for a plastic cup","telephone numbers","ways to avoid boredom"],["Why does boredom help creativity, according to researchers?","Our minds wander and make unusual connections.","We sleep more.","We use our phones less."],["What does the writer advise?","Don’t reach for your phone when you’re bored.","Always keep busy.","Read a telephone book every day."]],
fw:[["zerikarli","dull"],["o‘ylab topmoq","come up with"],["ijodkor","creative"],["qochmoq","avoid"]]},
W:{t:"An article giving advice",uz:"Maslahat beruvchi maqola",
err:"If you want *improving~to improve* your memory, try *to sleep~sleeping* more. *Don’t forget doing~Don’t forget to do* some exercise every day.",
m:{h:"Five ways to beat exam stress",l:["Do you feel nervous before exams? You’re not alone. Here are some tips to help you stay calm.","1 Make sure you plan your revision. Don’t try to learn everything the night before.","2 Take regular breaks. Your brain needs time to rest, otherwise you’ll lose concentration.","3 Avoid drinking too much coffee – it can make you feel even more anxious.","4 Try going for a short walk. Fresh air really helps.","5 Whatever you do, don’t compare yourself with others. Good luck!"]},
ph:["Make sure you … / It’s essential that you …","Try + -ing …","Avoid + -ing …","Whatever you do, don’t …","…, otherwise … / …, or else …","…, in case …"],
task:"Maktab yoki universitet jurnali uchun “Zerikishni qanday yengish mumkin” mavzusida 140–190 so‘zlik maslahat maqolasi yozing. Sarlavha va kamida 4 ta maslahat bo‘lsin.",min:140,max:190,
chk:[["try / avoid + -ing","\\b(try|avoid|stop|keep)\\s+\\w+ing\\b"],["Make sure / It’s essential","(make sure|essential|important to)"],["Taqiq maslahati (don’t / never)","\\b(don'?t|don’t|never)\\b"],["Sabab/ogohlantirish (otherwise / or else / in case)","(otherwise|or else|in case)"]]}},

6:{R:{t:"Living alone, together",
p:["In many countries the number of people living alone has risen dramatically. In Sweden, almost half of all households have just one [resident|aholi]. Experts link this trend to rising incomes, longer lives and a growing desire for [independence|mustaqillik]. But living alone can also be lonely.",
"One solution that is becoming popular in Europe is co-housing. Residents have their own private flats, but they share [facilities|qulayliklar] such as a large kitchen, a laundry and a garden. Most communities eat together two or three times a week and make decisions at regular meetings. ‘I have my own space, but I’m never [isolated|yolg‘izlanib qolgan],’ says one resident in Leeds.",
"For many Uzbeks, this idea sounds familiar. A traditional mahalla works in a similar way: neighbours help each other with weddings, repairs and childcare, and older people are rarely left alone. In fact, some European architects have studied the mahalla as a model of [community|jamoa] life. Perhaps the future of housing is not something completely new, but something we already know."],
uz:["Ko‘plab mamlakatlarda yolg‘iz yashaydigan odamlar soni keskin oshdi. Shvetsiyada barcha xonadonlarning deyarli yarmida faqat bitta aholi yashaydi. Mutaxassislar bu tendensiyani daromadlarning oshishi, umrning uzayishi va mustaqillikka bo‘lgan intilish bilan bog‘laydi. Ammo yolg‘iz yashash zerikarli va yolg‘izlik ham bo‘lishi mumkin.","Yevropada ommalashib borayotgan yechimlardan biri — birgalikda yashash (co-housing). Aholining shaxsiy kvartiralari bor, lekin ular katta oshxona, kir yuvish xonasi va bog‘ kabi qulayliklarni baham ko‘radi. Ko‘pchilik jamoalar haftasiga ikki-uch marta birga ovqatlanadi va muntazam yig‘ilishlarda qaror qabul qiladi. «Mening shaxsiy makonim bor, lekin hech qachon yolg‘izlanib qolmayman», — deydi Lidsdagi bir aholi.","Ko‘plab o‘zbeklar uchun bu g‘oya tanish eshitiladi. An’anaviy mahalla ham shunga o‘xshash ishlaydi: qo‘shnilar to‘y, ta’mirlash va bolalarga qarashda bir-biriga yordam beradi, keksalar kamdan-kam yolg‘iz qoladi. Aslida, ba’zi yevropalik me’morlar mahallani jamoa hayoti namunasi sifatida o‘rgangan. Ehtimol, uy-joyning kelajagi butunlay yangi narsa emas, balki biz allaqachon biladigan narsadir."],
tf:[["In Sweden, almost half of households have one person.",true],["Co-housing residents don’t have private flats.",false],["People in co-housing often eat together.",true],["European architects have never heard of the mahalla.",false]],
q:[["Which reason for living alone is NOT mentioned?","cheaper flats","rising incomes","longer lives"],["What do co-housing residents share?","a kitchen, a laundry and a garden","their bedrooms","their cars"],["What is the writer’s final point?","The mahalla is a good model for the future.","Co-housing will never work in Uzbekistan.","Everyone should live alone."]],
fw:[["mustaqillik","independence"],["qulayliklar","facilities"],["jamoa","community"],["aholi","resident"]]},

7:{R:{t:"Finders keepers?",
p:["Last spring, a taxi driver in Samarkand called Rustam noticed a small black bag on the back seat of his car. Inside he found $3,000 in cash, a passport and a plane ticket to Dubai. The passenger must have left it there by accident only an hour earlier.",
"Many people believe in the saying ‘finders keepers’, but in most countries it is actually [illegal|noqonuniy] to keep [lost property|yo‘qolgan buyum] if the owner can be found. Rustam didn’t even think about keeping the money. He drove straight to the airport and asked the staff to make an [announcement|e’lon]. Twenty minutes later, a very [relieved|yengil tortgan] businessman was shaking his hand.",
"The businessman offered Rustam a [reward|mukofot] of $500, but he refused to take it. ‘I only did what anyone should do,’ he explained. The story spread quickly on social media, and the city council later gave Rustam a certificate for his [honesty|halollik]. ‘My children were proud of me,’ he says. ‘That was worth more than any money.’"],
uz:["O‘tgan bahorda Samarqandlik Rustam ismli taksi haydovchisi mashinasining orqa o‘rindig‘ida kichik qora sumkani payqab qoldi. Uning ichida 3000 dollar naqd pul, pasport va Dubayga samolyot chiptasi bor edi. Yo‘lovchi uni bir soat oldin tasodifan qoldirgan bo‘lsa kerak.","Ko‘pchilik «topgan — egasi» degan maqolga ishonadi, lekin aksariyat mamlakatlarda, agar egasini topish mumkin bo‘lsa, yo‘qolgan buyumni olib qolish aslida noqonuniy. Rustam pulni olib qolish haqida o‘ylamadi ham. U to‘g‘ri aeroportga bordi va xodimlardan e’lon berishni so‘radi. Yigirma daqiqadan so‘ng juda yengil tortgan tadbirkor uning qo‘lini siqib turardi.","Tadbirkor Rustamga 500 dollar mukofot taklif qildi, ammo u olishdan bosh tortdi. «Men faqat har kim qilishi kerak bo‘lgan ishni qildim», — tushuntirdi u. Voqea ijtimoiy tarmoqlarda tez tarqaldi va keyinroq shahar hokimligi Rustamga halolligi uchun yorliq topshirdi. «Bolalarim men bilan faxrlanishdi, — deydi u. — Bu har qanday puldan qimmatroq edi.»"],
tf:[["Rustam found the bag in his taxi.",true],["There was a passport in the bag.",true],["Rustam took the money to the police station.",false],["Rustam accepted a $500 reward.",false]],
q:[["Where was the passenger probably going?","to Dubai","to Samarkand","to the police"],["What did Rustam ask the airport staff to do?","make an announcement","call the police","keep the bag"],["What did the city council give Rustam?","a certificate","$500","a new taxi"]],
fw:[["noqonuniy","illegal"],["mukofot","reward"],["halollik","honesty"],["e’lon","announcement"]]},

8:{R:{t:"Three generations, one office",
p:["At a busy IT company in Tashkent, three generations work side by side. Farhod, 52, is a manager who started his career before the internet [existed|mavjud bo‘lmoq] in Uzbekistan. Nilufar, 34, is a designer who remembers life before smartphones. And Sardor, 22, a programmer, has never known a world without them.",
"Each generation has its own [strengths|kuchli tomonlar]. Farhod is loyal and experienced, and he is respected for his calm way of solving problems. Nilufar values her [work-life balance|ish va hayot muvozanati] and is good at organizing projects. Sardor is extremely [tech-savvy|texnikani yaxshi biladigan], learns quickly and is always keen on trying new tools.",
"Of course, there are [misunderstandings|tushunmovchiliklar]. Farhod prefers phone calls, while Sardor replies only to messages. But the company has found that teams which mix ages produce better results. ‘The young ones teach us technology,’ says Farhod, ‘and we teach them patience.’ Sardor agrees: ‘Farhod has seen problems that I’m only reading about. Working with him has made me more [realistic|realist].’"],
uz:["Toshkentdagi gavjum IT kompaniyada uch avlod yonma-yon ishlaydi. 52 yoshli Farhod — menejer, u kareirasini O‘zbekistonda internet hali mavjud bo‘lmagan paytda boshlagan. 34 yoshli Nilufar — dizayner, u smartfonlardan oldingi hayotni eslaydi. 22 yoshli dasturchi Sardor esa ularsiz dunyoni hech qachon ko‘rmagan.","Har bir avlodning o‘z kuchli tomonlari bor. Farhod sodiq va tajribali, muammolarni xotirjam hal qilishi uchun hurmat qilinadi. Nilufar ish va hayot muvozanatini qadrlaydi va loyihalarni tashkil qilishda usta. Sardor texnikani juda yaxshi biladi, tez o‘rganadi va doim yangi vositalarni sinashga qiziqadi.","Albatta, tushunmovchiliklar ham bo‘ladi. Farhod telefon qo‘ng‘iroqlarini afzal ko‘radi, Sardor esa faqat xabarlarga javob beradi. Ammo kompaniya turli yoshdagilarni aralashtirgan jamoalar yaxshiroq natija berishini aniqladi. «Yoshlar bizga texnologiyani o‘rgatadi, — deydi Farhod, — biz esa ularga sabrni o‘rgatamiz.» Sardor ham rozi: «Farhod men endi o‘qiyotgan muammolarni ko‘rgan. U bilan ishlash meni realistroq qildi.»"],
tf:[["Farhod started working before the internet came to Uzbekistan.",true],["Nilufar is the youngest of the three.",false],["Sardor prefers phone calls.",false],["Mixed-age teams get better results at the company.",true]],
q:[["What is Farhod respected for?","his calm way of solving problems","his programming skills","his designs"],["What does Nilufar value?","her work-life balance","new technology","phone calls"],["What has Sardor learnt from Farhod?","to be more realistic","to use new tools","to make phone calls"]],
fw:[["kuchli tomonlar","strengths"],["texnikani yaxshi biladigan","tech-savvy"],["tushunmovchiliklar","misunderstandings"],["realist","realistic"]]},

m:{h:"Review: The Silk Road Festival, Samarkand",l:["Last weekend I went to the Silk Road Festival, which takes place every year in Samarkand.","The highlight for me was the evening concert in the Registan, where musicians from twelve countries performed together. The lighting was stunning.","I was also impressed by the food stalls, although they were a bit too packed for my liking.","The only disappointment was the long queue for tickets.","Overall, I would definitely recommend it to anyone who loves music and culture."]},

9:{R:{t:"When the sun never sets",
p:["Imagine a summer where it never gets dark. In northern Norway, the sun doesn’t set for about two months, a [phenomenon|hodisa] known as the midnight sun. Children play football at midnight, and many people find it hard to sleep. ‘When I first moved here from Tashkent, I didn’t sleep a wink for a week,’ says Aziza, a nurse in Tromsø.",
"Winter is the complete [opposite|teskarisi]. During the ‘polar night’, the sun doesn’t rise at all. You might expect people to stay indoors and feel depressed, but most locals don’t. They wrap up warm, go skiing under [artificial|sun’iy] lights and meet friends in cosy cafés. ‘The darkness is actually quite magical,’ Aziza says.",
"Over the years, Aziza has got used to the [extreme|keskin, o‘ta] seasons. In summer she sleeps with a thick mask and [blackout|yorug‘lik o‘tkazmaydigan] curtains, and in winter she uses a special lamp in the morning. ‘At home in Uzbekistan, I used to get up at the crack of dawn,’ she laughs. ‘Here, I’ve learnt to listen to my body instead of the sun.’"],
uz:["Hech qachon qorong‘i tushmaydigan yozni tasavvur qiling. Norvegiya shimolida quyosh taxminan ikki oy botmaydi — bu hodisa «yarim tun quyoshi» deb ataladi. Bolalar yarim tunda futbol o‘ynaydi, ko‘pchilik esa uxlashga qiynaladi. «Toshkentdan bu yerga birinchi ko‘chib kelganimda, bir hafta umuman uxlamadim», — deydi Tromsyodagi hamshira Aziza.","Qish esa butunlay teskarisi. «Qutb tuni» davomida quyosh umuman chiqmaydi. Odamlar uyda qolib, tushkunlikka tushadi deb kutishingiz mumkin, lekin mahalliy aholining ko‘pchiligi bunday emas. Ular issiq kiyinib, sun’iy chiroqlar ostida chang‘i uchadi va shinam kafelarda do‘stlari bilan uchrashadi. «Qorong‘ilik aslida ancha sehrli», — deydi Aziza.","Yillar davomida Aziza keskin fasllarga ko‘nikib qoldi. Yozda u qalin niqob va yorug‘lik o‘tkazmaydigan pardalar bilan uxlaydi, qishda esa ertalab maxsus chiroqdan foydalanadi. «Uyda, O‘zbekistonda, tong saharda turardim, — kuladi u. — Bu yerda esa quyoshga emas, tanamga quloq solishni o‘rgandim.»"],
tf:[["In northern Norway the sun doesn’t set for about two months in summer.",true],["Aziza slept very well during her first week.",false],["Most locals stay at home during the polar night.",false],["Aziza used to get up very early in Uzbekistan.",true]],
q:[["What do locals do during the polar night?","go skiing and meet friends","sleep all day","travel abroad"],["What does Aziza use in winter?","a special lamp","earplugs","blackout curtains only"],["What has Aziza learnt?","to listen to her body","to sleep in the day","to love the sun"]],
fw:[["hodisa","phenomenon"],["sun’iy","artificial"],["teskarisi","opposite"],["keskin, o‘ta","extreme"]]},
W:{t:"A report",uz:"Hisobot (report)",

10:{R:{t:"Why do we laugh?",
p:["Humans laugh around eighteen times a day, but scientists still argue about why we do it. One popular theory says that we laugh at [surprise|kutilmagan narsa]. A good joke leads us in one direction and then suddenly changes course in the punchline. Our brain has to shift quickly, and the [result|natija] is laughter.",
"Interestingly, most laughter has nothing to do with jokes. Researchers who [observed|kuzatmoq] people in cafés and shopping centres found that only about 15% of laughs followed something funny. The rest came after ordinary comments like ‘See you later!’. This suggests that laughter is mainly a [social|ijtimoiy] signal: it shows that we are friendly and relaxed.",
"That is why we laugh thirty times more often when we are with other people than when we are alone. It also explains why humour is so [personal|shaxsiy]. A sketch that one person finds hilarious may seem pointless or even irritating to someone else. Unless you share the same experiences, you may not ‘get’ the joke – even if you understand every [word|so‘z]."],
uz:["Odamlar kuniga taxminan o‘n sakkiz marta kuladi, ammo olimlar hanuz nima uchun kulishimiz haqida bahslashadi. Mashhur nazariyalardan biri biz kutilmagan narsaga kulamiz, deydi. Yaxshi latifa bizni bir yo‘nalishga olib boradi va yakunda to‘satdan yo‘nalishini o‘zgartiradi. Miyamiz tezda moslashishi kerak — natija esa kulgi.","Qizig‘i shundaki, kulgining aksariyati latifalarga aloqador emas. Kafe va savdo markazlarida odamlarni kuzatgan tadqiqotchilar kulgilarning atigi 15% ga yaqini kulgili narsadan keyin kelganini aniqladi. Qolganlari «Keyin ko‘rishguncha!» kabi oddiy gaplardan keyin bo‘lgan. Bu kulgi asosan ijtimoiy signal ekanini ko‘rsatadi: u do‘stona va xotirjam ekanimizni bildiradi.","Shuning uchun biz boshqalar bilan birga bo‘lganimizda yolg‘izlikdagidan o‘ttiz marta ko‘proq kulamiz. Bu, shuningdek, hazil nega bunchalik shaxsiy ekanini tushuntiradi. Bir kishiga juda kulgili tuyulgan sahna boshqasiga ma’nosiz yoki hatto asabga tegadigan tuyulishi mumkin. Agar tajribangiz umumiy bo‘lmasa, har bir so‘zini tushunsangiz ham, latifani «tushunmasligingiz» mumkin."],
tf:[["People laugh about eighteen times a day.",true],["Most laughter comes after jokes.",false],["We laugh more when we are alone.",false],["Different people can find the same sketch funny or irritating.",true]],
q:[["According to one theory, why do we laugh at jokes?","because of the surprise in the punchline","because jokes are long","because we are tired"],["What did researchers discover in cafés?","Only about 15% of laughs followed something funny.","People never laughed.","Most people told jokes."],["What is laughter mainly, according to the text?","a social signal","a sign of tiredness","a language skill"]],
fw:[["kuzatmoq","observed"],["ijtimoiy","social"],["natija","result"],["shaxsiy","personal"]]},

11:{R:{t:"The rise of ‘news snacking’",
p:["How do you get your news? If you are under thirty, the answer is probably ‘a few minutes at a time, on my phone’. A recent survey found that young people now ‘snack’ on news, checking headlines while they wait for the bus or during a commercial break, rather than reading a newspaper from start to finish.",
"Media experts have mixed feelings about this [trend|tendensiya]. On the one hand, young people are more [informed|xabardor] than ever before; they hear about events within seconds. On the other hand, short articles and listicles rarely give in-depth [analysis|tahlil]. One journalist warned that ‘people know a little about everything, but not much about anything’.",
"Another concern is that bad news spreads faster than good news. Stories about [conflict|nizo] and violence attract more clicks, so some websites focus on them. As a result, many readers say they feel stressed after checking the news. In response, several ‘positive news’ sites have appeared. Their editors insist that they are not ignoring problems; they simply want to report on [solutions|yechimlar] too."],
uz:["Yangiliklarni qanday olasiz? Agar o‘ttiz yoshdan kichik bo‘lsangiz, javob, ehtimol, «bir necha daqiqadan, telefonimda» bo‘ladi. Yaqindagi so‘rovnoma yoshlar endi gazetani boshidan oxirigacha o‘qish o‘rniga, avtobus kutayotganda yoki reklama tanaffusida sarlavhalarni ko‘zdan kechirib, yangiliklarni «tamaddi» qilishini aniqladi.","Media mutaxassislari bu tendensiyaga turlicha qaraydi. Bir tomondan, yoshlar har qachongidan ham xabardorroq; ular voqealar haqida soniyalar ichida eshitadi. Boshqa tomondan, qisqa maqolalar va ro‘yxat-maqolalar kamdan-kam chuqur tahlil beradi. Bir jurnalist «odamlar hamma narsa haqida ozgina biladi, lekin hech narsa haqida ko‘p bilmaydi» deb ogohlantirdi.","Yana bir xavotir — yomon yangiliklar yaxshilariga qaraganda tezroq tarqaladi. Nizo va zo‘ravonlik haqidagi xabarlar ko‘proq bosiladi, shuning uchun ba’zi saytlar asosan ularga e’tibor qaratadi. Natijada ko‘plab o‘quvchilar yangiliklarni ko‘rgandan keyin o‘zini asabiy his qilishini aytadi. Bunga javoban bir nechta «ijobiy yangiliklar» saytlari paydo bo‘ldi. Ularning muharrirlari muammolarni e’tiborsiz qoldirmayotganini, shunchaki yechimlar haqida ham xabar berishni istashlarini ta’kidlaydi."],
tf:[["Young people usually read newspapers from start to finish.",false],["Experts all agree that news snacking is a good thing.",false],["Bad news often spreads faster than good news.",true],["Positive news sites say they ignore problems.",false]],
q:[["When do young people often check the news?","while waiting for the bus","only in the evening","at the weekend"],["What is a disadvantage of short articles?","They rarely give in-depth analysis.","They are too expensive.","They are hard to find."],["Why do some websites focus on bad news?","It attracts more clicks.","It is more reliable.","Readers ask for it."]],
fw:[["xabardor","informed"],["tahlil","analysis"],["yechimlar","solutions"],["tendensiya","trend"]]},

12:{R:{t:"What do we regret most?",
p:["Psychologists who study regret have found something surprising. In the short term, we regret things we did: an angry message, an expensive purchase, a bad decision. But in the long term, we [mostly|asosan] regret the things we didn’t do. ‘If only I had travelled more,’ people say, or ‘I wish I had spent more time with my parents.’",
"One study asked people over seventy to name their biggest [regret|afsus]. The most common answers were not related to money or careers. Instead, they were about [relationships|munosabatlar]: not making up after a row, losing touch with old friends and not telling people they loved them. Education came second: many wished they had studied harder or [taken up|boshlamoq] a new skill.",
"The good news is that regret can be useful. It shows us what really matters, and it can [encourage|undamoq] us to change. As one 82-year-old put it: ‘If I could give my younger self one piece of advice, I would say: don’t wait for the perfect moment. Call your sister, learn the guitar, go to Samarkand. If you don’t, you’ll [wonder|o‘ylab qolmoq] what might have happened.’"],
uz:["Afsuslanishni o‘rganuvchi psixologlar hayratlanarli narsani aniqlashdi. Qisqa muddatda biz qilgan ishlarimizdan afsuslanamiz: jahl bilan yozilgan xabar, qimmat xarid, noto‘g‘ri qaror. Ammo uzoq muddatda asosan qilmagan ishlarimizdan afsuslanamiz. «Qani endi ko‘proq sayohat qilgan bo‘lsam», deydi odamlar yoki «Ota-onam bilan ko‘proq vaqt o‘tkazgan bo‘lsam edi».","Bir tadqiqotda yetmish yoshdan oshganlardan eng katta afsuslarini aytish so‘raldi. Eng ko‘p uchragan javoblar pul yoki kasbga emas, balki munosabatlarga tegishli edi: janjaldan keyin yarashmaslik, eski do‘stlar bilan aloqani yo‘qotish va yaxshi ko‘rgan odamlariga buni aytmaslik. Ikkinchi o‘rinda ta’lim turardi: ko‘pchilik qattiqroq o‘qishni yoki yangi ko‘nikma boshlashni istagan bo‘lardi.","Yaxshi xabar shuki, afsus foydali bo‘lishi mumkin. U bizga nima haqiqatan muhimligini ko‘rsatadi va o‘zgarishga undashi mumkin. 82 yoshli bir kishi aytganidek: «Agar yosh o‘zimga bitta maslahat bera olsam, shunday derdim: mukammal paytni kutma. Singlingga qo‘ng‘iroq qil, gitara o‘rgan, Samarqandga bor. Aks holda, nima bo‘lishi mumkin edi deb o‘ylab qolasan.»"],
tf:[["In the long term, people mostly regret things they didn’t do.",true],["Older people’s biggest regrets were about money.",false],["Education was the second most common regret.",true],["The writer thinks regret is always useless.",false]],
q:[["Which is an example of a short-term regret?","sending an angry message","not travelling more","losing touch with friends"],["What were the most common regrets about?","relationships","careers","money"],["What is the 82-year-old’s advice?","Don’t wait for the perfect moment.","Always save money.","Never make decisions quickly."]],
fw:[["afsus","regret"],["munosabatlar","relationships"],["undamoq","encourage"],["asosan","mostly"]]},

</script>
<script>
{
const COLORS=['#2f6fdc','#7c4dff','#0f8a6a','#d35400','#c2185b','#00838f','#b8860b','#5e35b1','#2e7d32','#e65100','#1565c0','#ad1457'];
let S={name:'',done:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('navB2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('navB2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

// build per-unit task model
UNITS.forEach((u,i)=>{
  u.c=COLORS[i];
  u.words=u.W.split(';').map(x=>{const [en,uz]=x.split('|');return{en,uz}});
  const r=rng(u.n*97+13);
  u.mcq=shuf(u.words,r).slice(0,8).map(w=>{const others=shuf(u.words.filter(x=>x!==w),r).slice(0,2);return{p:w.uz,o:shuf([w.en,...others.map(o=>o.en)],r),a:w.en}});
  u.typ=shuf(u.words.filter(w=>w.en.length<=16&&!/[\/(]/.test(w.en)),r).slice(0,6);
  u.gap=u.G.map(([s,a])=>{const others=shuf(u.G.filter(g=>g[1]!==a).map(g=>g[1]),r).slice(0,2);return{s,a,o:shuf([a,...others],r)}});
  u.gr.forEach(g=>g.mm=g.m.map(([p,...o])=>({p,a:o[0],o:shuf(o,r)})));
  u.bb=u.b.map(([uz,en])=>({uz,en,t:shuf(en.split(' '),r)}));
  // tasks: id -> number of items
  u.tasks={match:u.words.length,mc:u.mcq.length,type:u.typ.length,gap:u.gap.length,g0:u.gr[0].f.length+u.gr[0].m.length,g1:u.gr[1].f.length+u.gr[1].m.length,rtf:4,rq:3,rfw:4,werr:1,wtext:1,build:u.bb.length};
});
const TOTAL=UNITS.length*12;
const k=(u,t,i)=>`${u.n}-${t}-${i}`;
const isDone=(u,t,i)=>!!S.done[k(u,t,i)];
const taskDone=(u,t)=>{for(let i=0;i<u.tasks[t];i++)if(!isDone(u,t,i))return false;return true};
const unitCount=u=>Object.keys(u.tasks).filter(t=>taskDone(u,t)).length;
const allCount=()=>UNITS.reduce((s,u)=>s+unitCount(u),0);
function mark(u,t,i){S.done[k(u,t,i)]=1;save();refreshStatus(u)}

const head=document.getElementById('head'),app=document.getElementById('app');

function home(){
  head.innerHTML=`<h1>Ingliz tili · Uy vazifasi <small>Homework</small></h1><p>Navigate B2 Upper-intermediate · 12 unit · Lug‘at, o‘qish, grammatika va yozuv</p>`;
  const c=allCount();
  app.innerHTML=`<div class="card"><label class="h" for="nm">Ismingiz / Your name</label>
  <input type="text" id="nm" placeholder="Ismingizni yozing" value="${esc(S.name)}">
  <div class="bar"><i style="width:${c/TOTAL*100}%"></i></div><div class="meta">Umumiy natija: ${c} / ${TOTAL} topshiriq</div></div>`+
  UNITS.map(u=>{const d=unitCount(u);return`<button class="card unit" style="--c:${u.c}" data-u="${u.n}">
  <div class="k">${u.n}-UNIT · Unit ${u.n}</div><h2>${esc(u.t)} <span>${esc(u.uz)}</span></h2>
  <div class="tp"><b>Lug‘at:</b> ${esc(u.v)}<br><b>Grammatika:</b> ${esc(u.g)}<br><b>O‘qish:</b> ${esc(RW[u.n].R.t)} · <b>Yozuv:</b> ${esc(RW[u.n].W.t)}</div>
  <div class="bar"><i style="width:${d/12*100}%"></i></div><div class="meta">${d} / 12 topshiriq bajarildi</div></button>`}).join('')+
  `<div style="text-align:center"><button class="reset" id="rs">Natijalarni tozalash</button></div>`;
  document.getElementById('nm').oninput=e=>{S.name=e.target.value;save()};
  app.querySelectorAll('.unit').forEach(b=>b.onclick=()=>location.hash='u'+b.dataset.u+'-vocab');
  const rs=document.getElementById('rs');let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Ishonchingiz komilmi? Yana bir marta bosing';return}S.done={};save();home()};
}

const st=(u,t)=>{const n=u.tasks[t];let d=0;for(let i=0;i<n;i++)if(isDone(u,t,i))d++;return`<span class="st ${d===n?'done':''}" data-st="${u.n}-${t}">${d===n?'✓ Bajarildi':d+' / '+n}</span>`};
function refreshStatus(u){
  document.querySelectorAll('[data-st]').forEach(el=>{const [n,t]=el.dataset.st.split('-');const uu=UNITS[n-1];const tmp=document.createElement('div');tmp.innerHTML=st(uu,t);el.replaceWith(tmp.firstChild)});
  const m=document.getElementById('uprog');if(m)m.textContent=`${unitCount(u)} / 12 topshiriq bajarildi`;
}

function unit(n,tab){
  const u=UNITS[n-1];if(!u){home();return}
  head.innerHTML=`<div class="nav"><button class="pill" id="bk">← Barcha unitlar</button>${n>1?`<button class="pill" data-go="${n-1}">‹ ${n-1}-unit</button>`:''}${n<12?`<button class="pill" data-go="${n+1}">${n+1}-unit ›</button>`:''}</div>
  <h1>${n}-unit · ${esc(u.t)} <span class="uz">${esc(u.uz)}</span></h1><p id="uprog">${unitCount(u)} / 12 topshiriq bajarildi</p>`;
  head.parentElement.style.background=u.c;
  document.getElementById('bk').onclick=()=>location.hash='';
  head.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='u'+b.dataset.go+'-'+tab);
  app.innerHTML=`<div class="tabs"><button class="tab ${tab==='vocab'?'on':''}" data-t="vocab">Lug‘at</button><button class="tab ${tab==='reading'?'on':''}" data-t="reading">O‘qish</button><button class="tab ${tab==='grammar'?'on':''}" data-t="grammar">Grammatika</button><button class="tab ${tab==='writing'?'on':''}" data-t="writing">Yozuv</button></div><div id="body"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>location.hash='u'+n+'-'+b.dataset.t);
  const body=document.getElementById('body');
  ({vocab,reading,grammar,writing})[tab](u,body);
  window.scrollTo(0,0);
}

function fillQ(u,t,i,prompt,answers,hint){
  const done=isDone(u,t,i);const alts=answers.split('|');
  return`<div class="q" data-fill="${t}|${i}"><div class="p"><b>${i+1}</b>${esc(prompt)}</div>
  <div class="row"><input type="text" aria-label="Javob" placeholder="Javob" autocomplete="off" autocapitalize="off" spellcheck="false" class="${done?'ok':''}" value="${done?esc(alts[0]):''}">
  <button class="btn">Tekshirish</button><button class="btn o">Yordam</button></div><div class="fb ${done?'g':''}">${done?'✓ To‘g‘ri':''}</div></div>`;
}
function mcQ(u,t,i,num,prompt,opts,ans){
  const done=isDone(u,t,i);
  return`<div class="q" data-mc="${t}|${i}" data-a="${esc(ans)}"><div class="p"><b>${num}</b>${esc(prompt)}</div><div class="opts">${opts.map(o=>`<button class="opt ${done&&o===ans?'ok':''}">${esc(o)}</button>`).join('')}</div></div>`;
}
function bind(u,root,answersFor){
  root.querySelectorAll('[data-fill]').forEach(q=>{
    const [t,i]=q.dataset.fill.split('|');const {ans,hint}=answersFor(t,+i);
    const inp=q.querySelector('input'),fb=q.querySelector('.fb'),[chk,help]=q.querySelectorAll('button');
    const check=()=>{const v=norm(inp.value);if(!v)return;
      const okk=ans.split('|').some(a=>norm(a)===v);
      inp.classList.toggle('ok',okk);inp.classList.toggle('bad',!okk);
      fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Yana urinib ko‘ring';
      if(okk)mark(u,t,+i)};
    chk.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    help.onclick=()=>{fb.className='fb';fb.innerHTML=(hint?esc(hint)+' → ':'')+'Javob: <b>'+esc(ans.split('|')[0])+'</b>'};
  });
  root.querySelectorAll('[data-mc]').forEach(q=>{
    const [t,i]=q.dataset.mc.split('|');const a=q.dataset.a;
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      q.querySelectorAll('.opt').forEach(x=>x.classList.remove('bad'));
      if(b.textContent===a){b.classList.add('ok');mark(u,t,+i)}else b.classList.add('bad');
    });
  });
}

function vocab(u,body){
  const stages=[];for(let i=0;i<u.words.length;i+=6)stages.push(i);
  body.innerHTML=`<div class="card"><h3>So‘zlar banki</h3><div class="ins">So‘zni bosing — talaffuzini eshitasiz.</div>
  <div class="bank">${u.words.map(w=>`<button class="w" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.uz)}</span></button>`).join('')}</div></div>
  <div class="card"><h3>So‘z va ma’nosini juftlang ${st(u,'match')}</h3><div class="ins">Chapdan inglizcha so‘zni, o‘ngdan uning ma’nosini bosing. ${stages.length} bosqich.</div>
  ${stages.map((s,si)=>{const r=rng(u.n*31+si);const grp=u.words.slice(s,s+6).map((w,j)=>({...w,i:s+j}));
    return`<div class="stage">${si+1}-bosqich / ${stages.length}</div><div class="mt" data-stage><div>${shuf(grp,r).map(w=>`<button class="mb ${isDone(u,'match',w.i)?'ok':''}" data-l="${w.i}">${esc(w.en)}</button>`).join('')}</div><div>${shuf(grp,r).map(w=>`<button class="mb ${isDone(u,'match',w.i)?'ok':''}" data-r="${w.i}">${esc(w.uz)}</button>`).join('')}</div></div>`}).join('')}</div>
  <div class="card"><h3>O‘zbekchaga mos so‘z ${st(u,'mc')}</h3><div class="ins">To‘g‘ri inglizcha so‘zni tanlang.</div>
  ${u.mcq.map((q,i)=>mcQ(u,'mc',i,i+1,q.p,q.o,q.a)).join('')}</div>
  <div class="card"><h3>So‘zni yozing ${st(u,'type')}</h3><div class="ins">O‘zbekcha ma’nosiga qarab inglizcha yozing. Qiynalsangiz «Yordam»ni bosing.</div>
  ${u.typ.map((w,i)=>fillQ(u,'type',i,w.uz,w.en)).join('')}</div>
  <div class="card"><h3>Kitobdagi gaplar ${st(u,'gap')}</h3><div class="ins">Bo‘sh joyga mos so‘zni tanlang. Gaplar kitobdan olingan.</div>
  ${u.gap.map((g,i)=>mcQ(u,'gap',i,i+1,g.s,g.o,g.a)).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: O‘qish →</button>`;
  body.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  body.querySelectorAll('[data-stage]').forEach(m=>{let sel=null;
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;m.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');speak(b.textContent)});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('ok'))return;
      if(sel.dataset.l===b.dataset.r){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');mark(u,'match',+b.dataset.r);sel=null}
      else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),600)}});
  });
  bind(u,body,(t,i)=>({ans:u.typ[i].en,hint:''}));
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-reading';
}

function grammar(u,body){
  body.innerHTML=u.gr.map((g,gi)=>{const t='g'+gi;const nf=g.f.length;
    return`<div class="card"><h3>${esc(g.t)} ${st(u,t)}</h3><div class="ins">Qoidani o‘qing, shaklga keltiring, keyin to‘g‘ri gapni tanlang.</div>
    <div class="rule">${g.r}</div>
    ${g.f.map((f,i)=>fillQ(u,t,i,f[0],f[1],f[2])).join('')}
    ${g.mm.map((m,i)=>mcQ(u,t,nf+i,nf+i+1,m.p,m.o,m.a)).join('')}</div>`}).join('')+
  `<div class="card"><h3>Gap tuzing ${st(u,'build')}</h3><div class="ins">So‘zlarni bosib, to‘g‘ri tartibda gap tuzing.</div>
  ${u.bb.map((b,i)=>`<div class="q" data-build="${i}"><div class="p"><b>${i+1}</b>${esc(b.uz)}</div>
  <div class="zone">${isDone(u,'build',i)?b.en.split(' ').map(w=>`<span class="tok">${esc(w)}</span>`).join(''):''}</div>
  <div class="row" style="margin-bottom:8px">${b.t.map((w,j)=>`<button class="tok ${isDone(u,'build',i)?'used':''}" data-j="${j}">${esc(w)}</button>`).join('')}</div>
  <div class="row"><button class="btn">Tekshirish</button><button class="btn o">Tozalash</button></div><div class="fb ${isDone(u,'build',i)?'g':''}">${isDone(u,'build',i)?'✓ To‘g‘ri':''}</div></div>`).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: Yozuv →</button>`;
  bind(u,body,(t,i)=>{const g=u.gr[+t[1]];return{ans:g.f[i][1],hint:g.f[i][2]}});
  body.querySelectorAll('[data-build]').forEach(q=>{
    const i=+q.dataset.build,b=u.bb[i],zone=q.querySelector('.zone'),fb=q.querySelector('.fb');
    const [chk,clr]=q.querySelectorAll('.btn');
    q.querySelectorAll('[data-j]').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');
      const s=document.createElement('button');s.className='tok';s.textContent=t.textContent;s.onclick=()=>{s.remove();t.classList.remove('used')};zone.appendChild(s)});
    chk.onclick=()=>{const v=[...zone.children].map(x=>x.textContent).join(' ');
      const okk=norm(v)===norm(b.en);fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Tartib noto‘g‘ri, qayta urinib ko‘ring';
      if(okk){mark(u,'build',i);speak(b.en)}};
    clr.onclick=()=>{zone.innerHTML='';q.querySelectorAll('[data-j]').forEach(t=>t.classList.remove('used'));fb.textContent=''};
  });
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-writing';
}

const glossHtml=p=>esc(p).replace(/\[([^|\]]+)\|([^\]]+)\]/g,(m,w,t)=>`<button class="gl">${w}<small>(${t})</small></button>`);
const plain=p=>p.replace(/\[([^|\]]+)\|[^\]]+\]/g,'$1');
function reading(u,body){
  const R=RW[u.n].R;
  body.innerHTML=`<div class="card"><h3>${esc(R.t)}</h3><div class="ins">Matnni o‘qing. Tagiga chizilgan so‘zlarni bosing — tarjimasi chiqadi.</div>
  <div class="txt">${R.p.map(p=>`<p>${glossHtml(p)}</p>`).join('')}</div>
  <button class="btn o" id="say">🔊 Matnni tinglash</button>
  <details><summary>O‘zbekcha tarjima</summary>${R.uz.map(p=>`<p>${esc(p)}</p>`).join('')}</details></div>
  <div class="card"><h3>True or False? · To‘g‘ri yoki noto‘g‘ri? ${st(u,'rtf')}</h3><div class="ins">Matn bo‘yicha belgilang.</div>
  ${R.tf.map(([s,v],i)=>{const a=v?'True ✓':'False ✗',done=isDone(u,'rtf',i);return`<div class="q" data-mc="rtf|${i}" data-a="${a}"><div class="p"><b>${i+1}</b>${esc(s)}</div><div class="tf">${['True ✓','False ✗'].map(o=>`<button class="opt ${done&&o===a?'ok':''}">${o}</button>`).join('')}</div></div>`}).join('')}</div>
  <div class="card"><h3>Savollarga javob bering ${st(u,'rq')}</h3><div class="ins">Matn bo‘yicha javobni tanlang.</div>
  ${R.q.map(([p,...o],i)=>{const r=rng(u.n*53+i);return mcQ(u,'rq',i,i+1,p,shuf(o,r),o[0])}).join('')}</div>
  <div class="card"><h3>Matndan so‘zni toping ${st(u,'rfw')}</h3><div class="ins">Matndagi mos so‘z yoki iborani inglizcha yozing.</div>
  ${R.fw.map(([uz,en],i)=>fillQ(u,'rfw',i,uz,en)).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: Grammatika →</button>`;
  body.querySelectorAll('.gl').forEach(b=>b.onclick=()=>{b.classList.toggle('on');speak(b.firstChild.textContent)});
  const sb=document.getElementById('say');let on=false;
  sb.onclick=()=>{try{if(on){speechSynthesis.cancel();on=false;sb.textContent='🔊 Matnni tinglash';return}
    const ut=new SpeechSynthesisUtterance(R.p.map(plain).join(' '));ut.lang='en-GB';ut.rate=.9;ut.onend=()=>{on=false;sb.textContent='🔊 Matnni tinglash'};
    speechSynthesis.cancel();speechSynthesis.speak(ut);on=true;sb.textContent='⏹ To‘xtatish'}catch(e){}};
  bind(u,body,(t,i)=>({ans:R.fw[i][1],hint:''}));
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-grammar';
}
function writing(u,body){
  const W=RW[u.n].W;
  const segs=[];W.err.replace(/\*([^*~]+)~([^*]+)\*|(\S+)/g,(m,w,f,p)=>{segs.push(p?{w:p}:{w,f});return m});
  const nErr=segs.filter(x=>x.f).length,eDone=isDone(u,'werr',0);
  const txt=(S.texts&&S.texts[u.n])||'';
  body.innerHTML=`<h2 class="wt">${esc(W.t)}<span>${esc(W.uz)}</span></h2>
  <div class="card"><h3>1-qadam · Xatolarni toping ${st(u,'werr')}</h3><div class="ins">Xato yozilgan so‘z yoki qismlarni bosing (jami ${nErr} ta), keyin «Tekshirish»ni bosing.</div>
  <div class="errs">${segs.map((x,i)=>`<button class="et" data-i="${i}">${esc(x.w)}${eDone&&x.f?`<span class="fx">→ ${esc(x.f)}</span>`:''}</button>`).join('')}</div>
  <button class="btn" id="ec">Tekshirish</button><div class="fb" id="ef"></div></div>
  <div class="card"><h3>2-qadam · Namunani o‘qing</h3><div class="ins">Tuzilish va foydali iboralarga e’tibor bering.</div>
  <div class="model"><b>${esc(W.m.h)}</b>${W.m.l.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
  <div class="ph">${W.ph.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>
  <div class="card"><h3>3-qadam · Navbat sizda ✍️ ${st(u,'wtext')}</h3><div class="ins">${esc(W.task)}</div>
  <textarea id="ta" placeholder="Shu yerga ingliz tilida yozing…">${esc(txt)}</textarea>
  <div class="meta" id="wc"></div><ul class="chk" id="ck"></ul>
  <button class="btn" id="cp">📋 Nusxa olib, o‘qituvchiga yuborish</button>
  <div class="meta" id="cpm" style="margin-top:8px">Matningiz shu qurilmada saqlanadi. Tugma ismingiz, matningiz va natijangizni nusxalaydi — keyin uni o‘qituvchingizga yuboring.</div></div>
  ${u.n<12?`<button class="btn next" id="nx">Keyingi unit: ${u.n+1}-unit →</button>`:`<button class="btn next" id="nx">← Barcha unitlar</button>`}`;
  body.querySelectorAll('.et').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
  document.getElementById('ec').onclick=()=>{const ef=document.getElementById('ef');
    const sel=[...body.querySelectorAll('.et.sel')].map(b=>+b.dataset.i);
    const right=segs.map((x,i)=>x.f?i:-1).filter(i=>i>=0);
    const found=sel.filter(i=>right.includes(i)).length,wrong=sel.length-found;
    if(found===right.length&&!wrong){ef.className='fb g';ef.textContent='✓ Barakalla! Hamma xatolar topildi.';
      body.querySelectorAll('.et').forEach(b=>{const x=segs[+b.dataset.i];if(x.f&&!b.querySelector('.fx'))b.insertAdjacentHTML('beforeend',`<span class="fx">→ ${esc(x.f)}</span>`)});mark(u,'werr',0)}
    else{ef.className='fb r';ef.textContent=`✗ ${found} / ${right.length} ta xato topildi${wrong?`, ${wrong} ta to‘g‘ri so‘z belgilangan`:''}. Qayta urinib ko‘ring.`}};
  const ta=document.getElementById('ta'),wc=document.getElementById('wc'),ck=document.getElementById('ck');
  const words=t=>(t.match(/[A-Za-z’'-]+/g)||[]).length;
  const upd=()=>{const t=ta.value,n=words(t);
    wc.textContent=`${n} ta so‘z (maqsad: ${W.min}–${W.max})`;
    ck.innerHTML=`<li class="${n>=W.min?'y':''}">${n>=W.min?'✓':'○'} Kamida ${W.min} ta so‘z</li>`+W.chk.map(([l,r])=>{let ok=false;try{ok=n>0&&new RegExp(r,'im').test(t)}catch(e){}return`<li class="${ok?'y':''}">${ok?'✓':'○'} ${esc(l)}</li>`}).join('');
    S.texts=S.texts||{};S.texts[u.n]=t;save();
    if(n>=W.min&&!isDone(u,'wtext',0))mark(u,'wtext',0)};
  ta.oninput=upd;upd();
  document.getElementById('cp').onclick=()=>{
    const out=`Ism: ${S.name||'-'}\n${u.n}-unit · ${u.t} — ${W.t}\nNatija: ${unitCount(u)} / 12 topshiriq\n\n${ta.value}`;
    const m=document.getElementById('cpm');
    const fallback=()=>{ta.focus();ta.select();m.textContent='Nusxa olinmadi — matn belgilandi, uni o‘zingiz nusxalang (Ctrl+C).'};
    try{navigator.clipboard.writeText(out).then(()=>m.textContent='✓ Nusxa olindi! Endi o‘qituvchingizga yuboring.',fallback)}catch(e){fallback()}};
  document.getElementById('nx').onclick=()=>location.hash=u.n<12?'u'+(u.n+1)+'-vocab':'';
}

function route(){const m=location.hash.match(/^#u(\d+)-(vocab|reading|grammar|writing)$/);
  if(m)unit(+m[1],m[2]);else{head.parentElement.style.background='';home();}}
window.addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
